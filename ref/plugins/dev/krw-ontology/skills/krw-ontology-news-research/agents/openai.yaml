interface:
  display_name: "KRW Ontology News Research"
  short_description: "News-led equity research with KRW ontology investment interpretation"
  default_prompt: "Use $krw-ontology-news-research for news-mode equity research. Default output is Korean Markdown only. Start with current web search, extract the latest relevant news/report/event, then rewrite that event as a concise ontology/MCP-aware internal English investment brief and use KRW ontology query_context to retrieve company-specific baseline, financial channel, risk, and capital-allocation evidence. Synthesize news and ontology evidence into one fused Korean investor interpretation rather than mechanically separating sections. Respect research mode/tool budgets, write interpretation-first prose rather than raw-number dumps, use selected trace/chain only when allowed, do not expose mode/tool/pack/quality/schema/artifact/pipeline/web-search/internal terms or the English briefs, use CY labels, avoid generic limitation sections, avoid introducing non-covered companies, and end normal answers with exactly 3 Korean follow-up questions under '다음으로 파고들 질문'."
