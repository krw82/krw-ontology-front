services:
  web:
    cpus: "1.0"
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_URL=http://host.docker.internal:54321
      - GLOBAL_CONCURRENT_RUN_LIMIT=4
  document-worker:
    cpus: "0.3"
    mem_limit: 900m
    memswap_limit: 900m
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_URL=http://host.docker.internal:54321
      - DOCUMENT_INGESTION_CONCURRENT_LIMIT=1
      - MAX_DOCUMENT_ATTACHMENT_MB=20

  filing-notification-worker:
    cpus: "0.2"
    mem_limit: 320m
    memswap_limit: 320m
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_URL=http://host.docker.internal:54321

  reverse-proxy:
    cpus: "0.2"
    mem_limit: 256m
    memswap_limit: 256m
