services:
  reverse-proxy:
    image: caddy:2
    environment:
      - DOMAIN=${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${FRONT_DIR:-.}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      additional_contexts:
        krw-ontology-src: ${KRW_ONTOLOGY_SOURCE_DIR:-../krw-ontology}
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MCP_BASE_URL=http://mcp:8000
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN}
      - KRW_ONTOLOGY_ROOT=/srv/krw-ontology-data/current
      - KRW_ONTOLOGY_PLUGIN_PATH=/app/krw-ontology/plugins/krw-ontology
      - CLAUDE_AGENT_CWD=/app/krw-ontology
      - CLAUDE_CODE_EXECUTABLE=/usr/local/bin/claude-prod
      - CLAUDE_CONFIG_DIR=/home/nextjs/.claude-prod
      - WEB_COMMIT=${WEB_COMMIT}
      - KRW_ONTOLOGY_COMMIT=${KRW_ONTOLOGY_COMMIT}
      - DAILY_USER_QUESTION_LIMIT=${DAILY_USER_QUESTION_LIMIT:-20}
      - GLOBAL_CONCURRENT_RUN_LIMIT=${GLOBAL_CONCURRENT_RUN_LIMIT:-5}
      - DAILY_COST_CAP_USD=${DAILY_COST_CAP_USD:-5.00}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - CLAUDE_AGENT_MAX_TURNS=${CLAUDE_AGENT_MAX_TURNS:-40}
      - LEASE_TIMEOUT_MINUTES=${LEASE_TIMEOUT_MINUTES:-5}
    volumes:
      - /srv/krw-ontology-data:/srv/krw-ontology-data
      - ${CLAUDE_PROD_CONFIG_DIR:-/srv/claude-prod}:/home/nextjs/.claude-prod
    depends_on:
      mcp:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      additional_contexts:
        krw-ontology-src: ${KRW_ONTOLOGY_SOURCE_DIR:-../krw-ontology}
      args:
        KRW_ONTOLOGY_COMMIT: ${KRW_ONTOLOGY_COMMIT:-main}
    user: "0:0"
    environment:
      - KRW_ONTOLOGY_ROOT=/srv/krw-ontology-data/current
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_TRANSPORT=streamable-http
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
      - KRW_ONTOLOGY_COMMIT=${KRW_ONTOLOGY_COMMIT}
      - MCP_ALLOWED_HOSTS=127.0.0.1:*,localhost:*,[::1]:*,mcp:*
      - MCP_ALLOWED_ORIGINS=http://127.0.0.1:*,http://localhost:*,http://[::1]:*,http://web:3000
    volumes:
      - /srv/krw-ontology-data:/srv/krw-ontology-data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped
    # No ports: section — this container is NOT published to the host

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
