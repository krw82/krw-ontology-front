services:
  reverse-proxy:
    image: caddy:2
    environment:
      - DOMAIN=${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${FRONT_DIR:-.}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  web:
    image: krw-ontology-front-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
      additional_contexts:
        krw-ontology-src: ${KRW_ONTOLOGY_SOURCE_DIR:-../krw-ontology}
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - AUTH_REDIRECT_ORIGIN=${AUTH_REDIRECT_ORIGIN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - KRW_ONTOLOGY_ROOT=/srv/krw-ontology-data/current
      - KRW_ONTOLOGY_PLUGIN_PATH=/app/krw-ontology/plugins/krw-ontology
      - CLAUDE_AGENT_CWD=/app/agent-workspace
      - CLAUDE_CODE_EXECUTABLE=/usr/local/bin/claude-prod
      - CLAUDE_CONFIG_DIR=/home/nextjs/.claude-prod
      - WEB_COMMIT=${WEB_COMMIT}
      - KRW_ONTOLOGY_COMMIT=${KRW_ONTOLOGY_COMMIT}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin1@example.com}
      - GLOBAL_CONCURRENT_RUN_LIMIT=${GLOBAL_CONCURRENT_RUN_LIMIT:-5}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - CLAUDE_AGENT_MAX_TURNS=${CLAUDE_AGENT_MAX_TURNS:-20}
      - AGENT_MAX_TOOL_CALLS=${AGENT_MAX_TOOL_CALLS:-18}
      - AGENT_MAX_TOOL_RESULT_CHARS=${AGENT_MAX_TOOL_RESULT_CHARS:-100000}
      - AGENT_RUN_HARD_TIMEOUT_MINUTES=${AGENT_RUN_HARD_TIMEOUT_MINUTES:-15}
      - LEASE_TIMEOUT_MINUTES=${LEASE_TIMEOUT_MINUTES:-5}
      - MCP_HEALTH_TIMEOUT_MS=${MCP_HEALTH_TIMEOUT_MS:-30000}
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
    volumes:
      - /srv/krw-ontology-data:/srv/krw-ontology-data
      - ${CLAUDE_PROD_CONFIG_DIR:-/srv/claude-prod}:/home/nextjs/.claude-prod
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  agent-worker:
    image: krw-ontology-front-web:local
    command: ["node", ".worker/agent-worker.mjs"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - AUTH_REDIRECT_ORIGIN=${AUTH_REDIRECT_ORIGIN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - KRW_ONTOLOGY_ROOT=/srv/krw-ontology-data/current
      - KRW_ONTOLOGY_PLUGIN_PATH=/app/krw-ontology/plugins/krw-ontology
      - CLAUDE_AGENT_CWD=/app/agent-workspace
      - CLAUDE_CODE_EXECUTABLE=/usr/local/bin/claude-prod
      - CLAUDE_CONFIG_DIR=/home/nextjs/.claude-prod
      - WEB_COMMIT=${WEB_COMMIT}
      - KRW_ONTOLOGY_COMMIT=${KRW_ONTOLOGY_COMMIT}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin1@example.com}
      - GLOBAL_CONCURRENT_RUN_LIMIT=${GLOBAL_CONCURRENT_RUN_LIMIT:-5}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - CLAUDE_AGENT_MAX_TURNS=${CLAUDE_AGENT_MAX_TURNS:-20}
      - AGENT_MAX_TOOL_CALLS=${AGENT_MAX_TOOL_CALLS:-18}
      - AGENT_MAX_TOOL_RESULT_CHARS=${AGENT_MAX_TOOL_RESULT_CHARS:-100000}
      - AGENT_RUN_HARD_TIMEOUT_MINUTES=${AGENT_RUN_HARD_TIMEOUT_MINUTES:-15}
      - LEASE_TIMEOUT_MINUTES=${LEASE_TIMEOUT_MINUTES:-5}
      - LEASE_HEARTBEAT_INTERVAL_MS=${LEASE_HEARTBEAT_INTERVAL_MS:-60000}
      - AGENT_WORKER_POLL_INTERVAL_MS=${AGENT_WORKER_POLL_INTERVAL_MS:-1000}
      - MCP_HEALTH_TIMEOUT_MS=${MCP_HEALTH_TIMEOUT_MS:-30000}
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
    volumes:
      - /srv/krw-ontology-data:/srv/krw-ontology-data
      - ${CLAUDE_PROD_CONFIG_DIR:-/srv/claude-prod}:/home/nextjs/.claude-prod
    networks:
      - app-network
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
