services:
  reverse-proxy:
    image: caddy:2
    environment:
      - DOMAIN=${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${FRONT_DIR:-.}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      web:
        condition: service_started
      # Pulse, filings, and the primary web application must remain available
      # even when the optional LLM brief path is unavailable. The /llm route
      # can fail independently; only filing-brief-worker depends on the
      # private gateway below.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    image: krw-ontology-front-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_BRANDFETCH_CLIENT_ID: ${NEXT_PUBLIC_BRANDFETCH_CLIENT_ID:-}
        NEXT_PUBLIC_ENABLE_EMAIL_LOGIN: ${NEXT_PUBLIC_ENABLE_EMAIL_LOGIN:-1}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_BRANDFETCH_CLIENT_ID=${NEXT_PUBLIC_BRANDFETCH_CLIENT_ID:-}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_ENABLE_EMAIL_LOGIN=${NEXT_PUBLIC_ENABLE_EMAIL_LOGIN:-1}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      - NEXT_PUBLIC_APP_VERSION=${NEXT_PUBLIC_APP_VERSION}
      - GOOGLE_SITE_VERIFICATION=${GOOGLE_SITE_VERIFICATION:-}
      - PLAN_FEATURE_SPLIT_MODE=${PLAN_FEATURE_SPLIT_MODE:-review}
      - BUSINESS_NAME=${BUSINESS_NAME:-테스트컴퍼니}
      - BUSINESS_REPRESENTATIVE=${BUSINESS_REPRESENTATIVE:-홍길동}
      - BUSINESS_REGISTRATION_NUMBER=${BUSINESS_REGISTRATION_NUMBER:-000-00-00000}
      - BUSINESS_ECOMMERCE_REGISTRATION_NUMBER=${BUSINESS_ECOMMERCE_REGISTRATION_NUMBER:-2025-테스트구-0000}
      - BUSINESS_ADDRESS=${BUSINESS_ADDRESS:-서울시 테스트구 테스트로 1}
      - BUSINESS_PHONE=${BUSINESS_PHONE:-01000000000}
      - BUSINESS_EMAIL=${BUSINESS_EMAIL:-business@example.com}
      - BUSINESS_PRIVACY_OFFICER=${BUSINESS_PRIVACY_OFFICER:-홍길동}
      - AUTH_REDIRECT_ORIGIN=${AUTH_REDIRECT_ORIGIN}
      - TRUSTED_CLIENT_IP_HEADER=${TRUSTED_CLIENT_IP_HEADER:-x-krw-client-ip}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD:-}
      - OPENFIGI_API_KEY=${OPENFIGI_API_KEY:-}
      - DESKTOP_AUTH_CLIENT_ID=${DESKTOP_AUTH_CLIENT_ID:-krw-desktop-macos}
      - DESKTOP_AUTH_REDIRECT_URI=${DESKTOP_AUTH_REDIRECT_URI:-com.krw.desktop:/oauth/callback}
      - KRW_LLM_JOB_TOKEN_SECRET=${KRW_LLM_JOB_TOKEN_SECRET}
      - DESKTOP_LLM_GATEWAY_BASE_URL=${DESKTOP_LLM_GATEWAY_BASE_URL}
      - DESKTOP_LLM_MODEL_PROFILE=${DESKTOP_LLM_MODEL_PROFILE:-deepseek-v4-flash}
      - DESKTOP_LLM_SDK_MODEL=${DESKTOP_LLM_SDK_MODEL:-claude-sonnet-4-6}
      - DESKTOP_LLM_UPSTREAM_MODEL=${DESKTOP_LLM_UPSTREAM_MODEL:-deepseek-v4-flash}
      - DESKTOP_LLM_JOB_TOKEN_TTL_SECONDS=${DESKTOP_LLM_JOB_TOKEN_TTL_SECONDS:-600}
      - DESKTOP_LLM_JOB_MAX_REQUESTS=${DESKTOP_LLM_JOB_MAX_REQUESTS:-128}
      - DESKTOP_LLM_JOB_MAX_BUDGET_USD=${DESKTOP_LLM_JOB_MAX_BUDGET_USD:-1}
      - AGENT_RUN_EVENT_LISTEN_DATABASE_URL=${AGENT_RUN_EVENT_LISTEN_DATABASE_URL:-}
      - AGENT_RUN_EVENT_LISTEN_ENABLED=${AGENT_RUN_EVENT_LISTEN_ENABLED:-1}
      - AGENT_RUN_EVENT_LISTEN_CHANNEL=${AGENT_RUN_EVENT_LISTEN_CHANNEL:-agent_run_event}
      - AGENT_RUN_EVENT_LISTEN_RECONNECT_INTERVAL_MS=${AGENT_RUN_EVENT_LISTEN_RECONNECT_INTERVAL_MS:-5000}
      - AGENT_EVENT_RECONCILE_INTERVAL_MS=${AGENT_EVENT_RECONCILE_INTERVAL_MS:-15000}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - FILING_DETECTION_ENABLED=${FILING_DETECTION_ENABLED:-1}
      - CLAUDE_AGENT_CWD=/app/agent-workspace
      - CLAUDE_CODE_EXECUTABLE=/usr/local/bin/claude-prod
      - CLAUDE_CONFIG_DIR=/home/nextjs/.claude-prod
      - WEB_COMMIT=${WEB_COMMIT:-}
      - KRW_ONTOLOGY_COMMIT=${KRW_ONTOLOGY_COMMIT:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - MARKET_ISSUE_ENV=${MARKET_ISSUE_ENV:-prod}
      - MARKET_ISSUE_ADMIN_EMAILS=${MARKET_ISSUE_ADMIN_EMAILS:-}
      - ANALYSIS_CREDIT_ENFORCEMENT_MODE=${ANALYSIS_CREDIT_ENFORCEMENT_MODE:-enforced}
      - TOSS_PAYMENTS_CLIENT_KEY=${TOSS_PAYMENTS_CLIENT_KEY:-}
      - TOSS_PAYMENTS_SECRET_KEY=${TOSS_PAYMENTS_SECRET_KEY:-}
      - TOSS_PAYMENTS_API_BASE_URL=${TOSS_PAYMENTS_API_BASE_URL:-https://api.tosspayments.com}
      - BILLING_CRON_SECRET=${BILLING_CRON_SECRET:-}
      - BILLING_MUTATIONS_PER_USER_PER_MINUTE=${BILLING_MUTATIONS_PER_USER_PER_MINUTE:-5}
      - GLOBAL_CONCURRENT_RUN_LIMIT=${GLOBAL_CONCURRENT_RUN_LIMIT:-8}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - CLAUDE_AGENT_MAX_TURNS=${CLAUDE_AGENT_MAX_TURNS:-20}
      - AGENT_MAX_TOOL_CALLS=${AGENT_MAX_TOOL_CALLS:-18}
      - AGENT_MAX_TOOL_RESULT_CHARS=${AGENT_MAX_TOOL_RESULT_CHARS:-100000}
      - AGENT_RUN_HARD_TIMEOUT_MINUTES=${AGENT_RUN_HARD_TIMEOUT_MINUTES:-10}
      - LEASE_TIMEOUT_MINUTES=${LEASE_TIMEOUT_MINUTES:-10}
      - MCP_HEALTH_TIMEOUT_MS=${MCP_HEALTH_TIMEOUT_MS:-30000}
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
      - DOCUMENT_STORAGE_ROOT=/srv/krw-document-inbox
      # Optional dedicated Redis/Valkey DB for shared Pulse candidates. When
      # omitted, Pulse falls back to the existing queue Redis URL.
      - PULSE_REDIS_URL=${PULSE_REDIS_URL:-}
      - REDIS_QUEUE_URL=${REDIS_QUEUE_URL:-}
      - DOCUMENT_QUEUE_REDIS_URL=${DOCUMENT_QUEUE_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ${CLAUDE_PROD_CONFIG_DIR:-/srv/claude-prod}:/home/nextjs/.claude-prod
      - document_inbox:/srv/krw-document-inbox
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  llm-gateway:
    image: krw-ontology-front-web:local
    command: ["node", ".services/llm-gateway.mjs"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    environment:
      - PORT=8787
      - SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - KRW_LLM_JOB_TOKEN_SECRET=${KRW_LLM_JOB_TOKEN_SECRET}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_ANTHROPIC_BASE_URL=${DEEPSEEK_ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}
      - DEEPSEEK_OPENAI_BASE_URL=${DEEPSEEK_OPENAI_BASE_URL:-https://api.deepseek.com}
      - LLM_GATEWAY_MAX_BODY_BYTES=${LLM_GATEWAY_MAX_BODY_BYTES:-4194304}
      # This shared secret is used only on the private compose network by the
      # filing-brief worker. It is never exposed to browsers or Desktop.
      - FILING_BRIEF_GATEWAY_TOKEN=${FILING_BRIEF_GATEWAY_TOKEN:-}
      - FILING_BRIEF_MODEL=${FILING_BRIEF_MODEL:-deepseek-v4-flash}
      - FILING_BRIEF_UPSTREAM_TIMEOUT_MS=${FILING_BRIEF_UPSTREAM_TIMEOUT_MS:-30000}
      - FILING_BRIEF_GATEWAY_MAX_BODY_BYTES=${FILING_BRIEF_GATEWAY_MAX_BODY_BYTES:-524288}
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Internal-only, stateless MCP for reading one verified SEC filing on
  # demand. It intentionally has no volume for document bodies.
  filings-mcp:
    image: krw-ontology-front-web:local
    command: ["node", ".worker/filings-mcp-server.mjs"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - FILINGS_MCP_ENABLED=${FILINGS_MCP_ENABLED:-0}
      - FILINGS_MCP_AUTH_TOKEN=${FILINGS_MCP_AUTH_TOKEN:-}
      - FILINGS_MCP_PERSONAL_SIGNING_SECRET=${FILINGS_MCP_PERSONAL_SIGNING_SECRET:-}
      - FILINGS_MCP_HOST=0.0.0.0
      - FILINGS_MCP_PORT=8785
      - FILINGS_MCP_ENV=${FILING_WORKER_ENV:-prod}
      - FILINGS_MCP_MAX_DOCUMENT_BYTES=${FILINGS_MCP_MAX_DOCUMENT_BYTES:-10485760}
      - FILINGS_MCP_MAX_DOCUMENT_CHARS=${FILINGS_MCP_MAX_DOCUMENT_CHARS:-1500000}
      - FILINGS_MCP_CACHE_TTL_MS=${FILINGS_MCP_CACHE_TTL_MS:-300000}
      - FILINGS_MCP_CACHE_MAX_ENTRIES=${FILINGS_MCP_CACHE_MAX_ENTRIES:-16}
      - SEC_GLOBAL_MIN_REQUEST_INTERVAL_MS=${SEC_GLOBAL_MIN_REQUEST_INTERVAL_MS:-150}
      - SEC_USER_AGENT=${SEC_USER_AGENT:-}
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('fs').accessSync('.worker/filings-mcp-server.mjs'); fetch('http://127.0.0.1:8785/health').then(r=>{if(!r.ok) throw new Error('filings MCP unhealthy')}).catch(e=>{console.error(e);process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  document-worker:
    image: krw-ontology-front-web:local
    command: ["node", ".worker/document-worker.mjs"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DOCUMENT_WORKER_ID=${DOCUMENT_WORKER_ID:-gcp-document-worker}
      - DOCUMENT_STORAGE_ROOT=/srv/krw-document-inbox
      - DOCUMENT_INGESTION_BACKEND=${DOCUMENT_INGESTION_BACKEND:-bullmq}
      - DOCUMENT_INGESTION_CONCURRENT_LIMIT=${DOCUMENT_INGESTION_CONCURRENT_LIMIT:-2}
      - DOCUMENT_WORKER_RECONCILE_INTERVAL_MS=${DOCUMENT_WORKER_RECONCILE_INTERVAL_MS:-5000}
      - MAX_DOCUMENT_ATTACHMENT_MB=${MAX_DOCUMENT_ATTACHMENT_MB:-20}
      - MAX_EXTRACTED_MARKDOWN_CHARS=${MAX_EXTRACTED_MARKDOWN_CHARS:-200000}
      - MARKITDOWN_COMMAND=${MARKITDOWN_COMMAND:-markitdown}
      - MARKITDOWN_TIMEOUT_MS=${MARKITDOWN_TIMEOUT_MS:-120000}
      - REDIS_QUEUE_URL=${REDIS_QUEUE_URL:-}
      - DOCUMENT_QUEUE_REDIS_URL=${DOCUMENT_QUEUE_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - document_inbox:/srv/krw-document-inbox
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('fs').accessSync('.worker/document-worker.mjs'); if ((process.env.DOCUMENT_INGESTION_BACKEND || 'legacy_db') === 'bullmq' && !(process.env.REDIS_QUEUE_URL || process.env.DOCUMENT_QUEUE_REDIS_URL)) { console.error('document-worker missing Redis queue URL'); process.exit(1); }",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  document-outbox-dispatcher:
    image: krw-ontology-front-web:local
    command: ["node", ".worker/document-outbox-dispatcher.mjs"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DOCUMENT_OUTBOX_DISPATCHER_ID=${DOCUMENT_OUTBOX_DISPATCHER_ID:-gcp-document-outbox-dispatcher}
      - DOCUMENT_OUTBOX_DISPATCH_INTERVAL_MS=${DOCUMENT_OUTBOX_DISPATCH_INTERVAL_MS:-15000}
      - DOCUMENT_OUTBOX_DISPATCH_BATCH_SIZE=${DOCUMENT_OUTBOX_DISPATCH_BATCH_SIZE:-25}
      - REDIS_QUEUE_URL=${REDIS_QUEUE_URL:-}
      - DOCUMENT_QUEUE_REDIS_URL=${DOCUMENT_QUEUE_REDIS_URL:-redis://redis:6379/0}
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('fs').accessSync('.worker/document-outbox-dispatcher.mjs'); if (!(process.env.REDIS_QUEUE_URL || process.env.DOCUMENT_QUEUE_REDIS_URL)) { console.error('document-outbox-dispatcher missing Redis queue URL'); process.exit(1); }",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  filing-notification-worker:
    image: krw-ontology-front-web:local
    command: ["node", ".worker/filing-notification-worker.mjs"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - FILING_DETECTION_ENABLED=${FILING_DETECTION_ENABLED:-1}
      - FILING_NOTIFICATION_CREATION_ENABLED=${FILING_NOTIFICATION_CREATION_ENABLED:-0}
      - FILING_PUSH_ENABLED=${FILING_PUSH_ENABLED:-0}
      - FILING_NOTIFICATION_WORKER_ID=${FILING_NOTIFICATION_WORKER_ID:-gcp-filing-notification-worker}
      - FILING_WORKER_DEPLOYMENT_ID=${NEXT_PUBLIC_APP_VERSION}
      - FILING_WORKER_ENV=${FILING_WORKER_ENV:-prod}
      - FILING_WORKER_TICK_MS=${FILING_WORKER_TICK_MS:-15000}
      - SEC_CIK_POLL_INTERVAL_MS=${SEC_CIK_POLL_INTERVAL_MS:-300000}
      - SEC_FILING_POLL_BATCH_SIZE=${SEC_FILING_POLL_BATCH_SIZE:-10}
      - FILING_NOTIFICATION_DELIVERY_BATCH_SIZE=${FILING_NOTIFICATION_DELIVERY_BATCH_SIZE:-25}
      - FILING_NOTIFICATION_MAX_PUSH_ATTEMPTS=${FILING_NOTIFICATION_MAX_PUSH_ATTEMPTS:-8}
      - SEC_FILING_REQUEST_DELAY_MS=${SEC_FILING_REQUEST_DELAY_MS:-650}
      - SEC_GLOBAL_MIN_REQUEST_INTERVAL_MS=${SEC_GLOBAL_MIN_REQUEST_INTERVAL_MS:-150}
      - SEC_GLOBAL_DISCOVERY_SOURCES_PER_CYCLE=${SEC_GLOBAL_DISCOVERY_SOURCES_PER_CYCLE:-2}
      - SEC_GLOBAL_SCHEDULER_LEASE_SECONDS=${SEC_GLOBAL_SCHEDULER_LEASE_SECONDS:-300}
      - SEC_GLOBAL_RECONCILIATION_BATCH_SIZE=${SEC_GLOBAL_RECONCILIATION_BATCH_SIZE:-10}
      - SEC_GLOBAL_ENRICHMENT_BATCH_SIZE=${SEC_GLOBAL_ENRICHMENT_BATCH_SIZE:-10}
      - SEC_GLOBAL_NOTIFICATION_BATCH_SIZE=${SEC_GLOBAL_NOTIFICATION_BATCH_SIZE:-25}
      - SEC_GLOBAL_CATALOG_LOOKBACK_DAYS=${SEC_GLOBAL_CATALOG_LOOKBACK_DAYS:-90}
      - SEC_GLOBAL_BASELINE_CLEANUP_BATCH_SIZE=${SEC_GLOBAL_BASELINE_CLEANUP_BATCH_SIZE:-500}
      - FILING_TICKER_PUSH_BATCH_WINDOW_MS=${FILING_TICKER_PUSH_BATCH_WINDOW_MS:-600000}
      - FILING_RETENTION_CLEANUP_INTERVAL_MS=${FILING_RETENTION_CLEANUP_INTERVAL_MS:-86400000}
      - SEC_USER_AGENT=${SEC_USER_AGENT:-}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    networks:
      - app-network
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('fs').accessSync('.worker/filing-notification-worker.mjs'); const detection = process.env.FILING_DETECTION_ENABLED !== '0'; const push = process.env.FILING_PUSH_ENABLED === '1'; const keys = detection ? ['SEC_USER_AGENT'] : []; if (push) keys.push('NEXT_PUBLIC_VAPID_PUBLIC_KEY', 'VAPID_PRIVATE_KEY', 'VAPID_SUBJECT'); for (const key of keys) { if (!process.env[key]) { console.error('missing ' + key); process.exit(1); } }",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Deliberately separate from SEC discovery/enrichment. This worker reads a
  # bounded SEC source, calls the private gateway, and persists only the
  # validated brief—not raw filing bodies.
  filing-brief-worker:
    image: krw-ontology-front-web:local
    command: ["node", ".worker/filing-brief-worker.mjs"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - FILING_WORKER_ENV=${FILING_WORKER_ENV:-prod}
      - FILING_BRIEF_ENABLED=${FILING_BRIEF_ENABLED:-0}
      - FILING_BRIEF_WORKER_ID=${FILING_BRIEF_WORKER_ID:-gcp-filing-brief-worker}
      - FILING_BRIEF_WORKER_TICK_MS=${FILING_BRIEF_WORKER_TICK_MS:-5000}
      - FILING_BRIEF_BATCH_SIZE=${FILING_BRIEF_BATCH_SIZE:-2}
      - FILING_BRIEF_MAX_JOBS_PER_DAY=${FILING_BRIEF_MAX_JOBS_PER_DAY:-500}
      - FILING_BRIEF_MAX_INPUT_CHARS=${FILING_BRIEF_MAX_INPUT_CHARS:-24000}
      - FILING_BRIEF_MAX_DOCUMENT_BYTES=${FILING_BRIEF_MAX_DOCUMENT_BYTES:-10485760}
      - FILING_BRIEF_SEC_MIN_REQUEST_INTERVAL_MS=${FILING_BRIEF_SEC_MIN_REQUEST_INTERVAL_MS:-150}
      - FILING_BRIEF_GATEWAY_URL=${FILING_BRIEF_GATEWAY_URL:-http://llm-gateway:8787}
      - FILING_BRIEF_GATEWAY_TOKEN=${FILING_BRIEF_GATEWAY_TOKEN:-}
      - FILING_BRIEF_GATEWAY_TIMEOUT_MS=${FILING_BRIEF_GATEWAY_TIMEOUT_MS:-30000}
      - FILING_BRIEF_MODEL=${FILING_BRIEF_MODEL:-deepseek-v4-flash}
      - FILING_BRIEF_MAX_OUTPUT_TOKENS=${FILING_BRIEF_MAX_OUTPUT_TOKENS:-600}
      - SEC_USER_AGENT=${SEC_USER_AGENT:-}
    networks:
      - app-network
    depends_on:
      llm-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('fs').accessSync('.worker/filing-brief-worker.mjs'); if (process.env.FILING_BRIEF_ENABLED === '1') { for (const key of ['FILING_BRIEF_GATEWAY_TOKEN', 'SEC_USER_AGENT']) { if (!process.env[key]) { console.error('missing ' + key); process.exit(1); } } }",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Market issues are deliberately review-first. With the default settings this
  # process idles safely until an operator enables ingestion and configures an
  # official X API bearer token.
  market-issue-worker:
    image: krw-ontology-front-web:local
    command: ["node", ".worker/market-issue-worker.mjs"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MARKET_ISSUE_ENV=${MARKET_ISSUE_ENV:-prod}
      - MARKET_ISSUE_WORKER_ID=${MARKET_ISSUE_WORKER_ID:-gcp-market-issue-worker}
      - MARKET_ISSUE_INGESTION_INTERVAL_MS=${MARKET_ISSUE_INGESTION_INTERVAL_MS:-300000}
      - MARKET_ISSUE_X_API_BASE_URL=${MARKET_ISSUE_X_API_BASE_URL:-https://api.x.com}
      - MARKET_ISSUE_X_BEARER_TOKEN=${MARKET_ISSUE_X_BEARER_TOKEN:-}
      - MARKET_ISSUE_X_MAX_POSTS_PER_SOURCE=${MARKET_ISSUE_X_MAX_POSTS_PER_SOURCE:-20}
      - MARKET_ISSUE_X_SOURCES=${MARKET_ISSUE_X_SOURCES:-[]}
      - MARKET_ISSUE_SUMMARIZER_URL=${MARKET_ISSUE_SUMMARIZER_URL:-}
      - MARKET_ISSUE_SUMMARIZER_TOKEN=${MARKET_ISSUE_SUMMARIZER_TOKEN:-}
      - MARKET_ISSUE_REDIS_URL=${MARKET_ISSUE_REDIS_URL:-}
      - REDIS_QUEUE_URL=${REDIS_QUEUE_URL:-}
    networks:
      - app-network
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('fs').accessSync('.worker/market-issue-worker.mjs')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  billing-worker:
    image: krw-ontology-front-web:local
    command: ["node", ".worker/billing-worker.mjs"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - TOSS_PAYMENTS_CLIENT_KEY=${TOSS_PAYMENTS_CLIENT_KEY:-}
      - TOSS_PAYMENTS_SECRET_KEY=${TOSS_PAYMENTS_SECRET_KEY:-}
      - TOSS_PAYMENTS_API_BASE_URL=${TOSS_PAYMENTS_API_BASE_URL:-https://api.tosspayments.com}
      - BILLING_WORKER_ID=${BILLING_WORKER_ID:-gcp-billing-worker}
      - BILLING_WORKER_RECONCILE_INTERVAL_MS=${BILLING_WORKER_RECONCILE_INTERVAL_MS:-60000}
      - BILLING_WORKER_REQUIRE_TOSS_PAYMENTS=${BILLING_WORKER_REQUIRE_TOSS_PAYMENTS:-1}
      - BILLING_WORKER_ALLOW_TOSS_TEST_KEYS=${BILLING_WORKER_ALLOW_TOSS_TEST_KEYS:-0}
    networks:
      - app-network
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('fs').accessSync('.worker/billing-worker.mjs'); const e=process.env; if (e.BILLING_WORKER_REQUIRE_TOSS_PAYMENTS !== '0') { const ck=e.TOSS_PAYMENTS_CLIENT_KEY || ''; const sk=e.TOSS_PAYMENTS_SECRET_KEY || ''; const live=ck.startsWith('live_ck_') && sk.startsWith('live_sk_') && !ck.includes('...') && !sk.includes('...'); const test=e.BILLING_WORKER_ALLOW_TOSS_TEST_KEYS === '1' && ck.startsWith('test_ck_') && sk.startsWith('test_sk_') && !ck.includes('...') && !sk.includes('...'); if (!live && !test) { console.error('billing-worker missing usable Toss Payments keys'); process.exit(1); } }",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  document_inbox:
  redis_data:
